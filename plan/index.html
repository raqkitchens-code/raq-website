/* fix prompt, phase B (H2): blocking problems in guided mode */
.gstop{border:2px solid #c0392b;background:#fdecea;color:#7b1d14;border-radius:10px;padding:10px 12px;margin:0 0 12px}
.gstop ul{margin:6px 0;padding-inline-start:18px}.gstop li{margin:4px 0}.gstop button{margin-inline-start:6px;font-size:.85em}
/* fix prompt, phase D: the chosen upper style */
.replist button.on{outline:2px solid #2e7d32;outline-offset:1px}
/* fix prompt, E4: parked items in a strip above the plan (no longer drawn over it) */
.parkbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;margin:0 0 6px;border:1px dashed #b26a00;border-radius:8px;background:#fff8e6;color:#6b4000;font-size:.9em}

.rnext li{margin:4px 0}.complete{border-inline-start:4px solid #b26a00}.complete.done{border-inline-start-color:#2e7d32}
